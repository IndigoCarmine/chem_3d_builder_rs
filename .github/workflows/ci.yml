name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format & clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install build dependencies
        # The GTK/X11/Wayland/OpenSSL headers below are what the eframe/wgpu
        # stack needs, and what an OpenBabel source build needs when no prebuilt
        # is available (see the next step). cmake and a C++ toolchain are
        # already on the runner image.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libegl1-mesa-dev \
            libssl-dev

      - name: Fetch prebuilt OpenBabel
        # openbabel_rs attaches OpenBabel, already built on the *-latest runners,
        # to each tagged release. With OPENBABEL_SYS_PREBUILT_DIR pointing at it,
        # openbabel-sys skips its 10-20 minute C++ build. The tag is read out of
        # Cargo.lock so it cannot drift from what cargo builds; with no tag pin or
        # no archive for this target, the build falls back to compiling OpenBabel.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(grep -m1 -o 'openbabel_rs?tag=[^#]*' Cargo.lock | cut -d= -f2 || true)
          triple=$(rustc -vV | sed -n 's/^host: //p')
          archive="openbabel-sys-$triple.tar.gz"
          if [ -z "$tag" ]; then
            echo "::warning::openbabel_rs is not pinned to a tag; building OpenBabel from source"
            exit 0
          fi
          cd "$RUNNER_TEMP"
          if ! gh release download "$tag" -R IndigoCarmine/openbabel_rs -p "$archive" --clobber; then
            echo "::warning::openbabel_rs $tag has no $archive; building OpenBabel from source"
            exit 0
          fi
          mkdir -p openbabel-sys
          tar -xzf "$archive" -C openbabel-sys
          echo "OPENBABEL_SYS_PREBUILT_DIR=$RUNNER_TEMP/openbabel-sys" >> "$GITHUB_ENV"

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libegl1-mesa-dev \
            libssl-dev

      - name: Fetch prebuilt OpenBabel
        # Same as in the lint job: use the OpenBabel attached to the openbabel_rs
        # release Cargo.lock pins, falling back to a source build without one.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(grep -m1 -o 'openbabel_rs?tag=[^#]*' Cargo.lock | cut -d= -f2 || true)
          triple=$(rustc -vV | sed -n 's/^host: //p')
          archive="openbabel-sys-$triple.tar.gz"
          if [ -z "$tag" ]; then
            echo "::warning::openbabel_rs is not pinned to a tag; building OpenBabel from source"
            exit 0
          fi
          cd "$RUNNER_TEMP"
          if ! gh release download "$tag" -R IndigoCarmine/openbabel_rs -p "$archive" --clobber; then
            echo "::warning::openbabel_rs $tag has no $archive; building OpenBabel from source"
            exit 0
          fi
          mkdir -p openbabel-sys
          tar -xzf "$archive" -C openbabel-sys
          echo "OPENBABEL_SYS_PREBUILT_DIR=$RUNNER_TEMP/openbabel-sys" >> "$GITHUB_ENV"

      - name: Compile tests
        run: cargo test --all-targets --no-run

      - name: Stage OpenBabel plugins next to the test binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # On Windows OpenBabel discovers its .obf format plugins in the
          # directory of openbabel-3.dll (GetModuleFileName), not via an env
          # var, so openbabel-sys's build script copies the DLL and the plugins
          # next to the test binaries as a *side effect* of running. A warm
          # Swatinem/rust-cache restores a built openbabel-sys without
          # re-running that build script, so on a cache hit the plugins are
          # never staged and every format load fails at runtime
          # ("parse: Parse { format: \"smi\" }"). Re-stage them from the cached
          # install tree, which rust-cache does preserve.
          #
          # Ask cargo which build directory it linked rather than globbing
          # target\debug\build: a restored cache can hold several
          # openbabel-sys-<hash> directories (one per source/prebuilt build).
          # This re-run is a no-op that only re-emits the metadata.
          $outDir = cargo test --all-targets --no-run --message-format=json |
            ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object { $_.reason -eq 'build-script-executed' -and $_.package_id -like '*openbabel-sys*' } |
            Select-Object -First 1 -ExpandProperty out_dir
          if (-not $outDir) { throw "could not find openbabel-sys's build output directory" }
          # A source build installs into out\, a prebuilt is copied to out\prebuilt\.
          $bin = @("$outDir\prebuilt\bin", "$outDir\bin") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $bin) { throw "no OpenBabel install tree (bin\) under $outDir" }
          $runtime = Get-ChildItem "$bin\*" -Include *.dll, *.obf
          if ($runtime.Count -eq 0) { throw "no .dll/.obf runtime found in $bin" }
          foreach ($dir in 'target\debug', 'target\debug\deps') {
            New-Item -ItemType Directory -Force $dir | Out-Null
            Copy-Item -Force $runtime $dir
          }
          Write-Host "Staged $($runtime.Count) runtime files from $bin into target\debug{,\deps}"

      - name: Run tests
        run: cargo test --all-targets

      - run: cargo build --release
