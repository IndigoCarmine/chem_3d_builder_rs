name: Release

# Build native installers for Windows / macOS / Linux and attach them to a
# GitHub Release whenever a version tag (e.g. `v0.4.0`) is pushed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create the release and upload assets

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (AppImage)
            os: ubuntu-22.04 # oldest supported → widest glibc compatibility
          - name: Windows (NSIS)
            os: windows-latest
          - name: macOS (dmg)
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # ---------------------------------------------------------------- Linux
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev librsvg2-bin librsvg2-common \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libssl-dev \
            desktop-file-utils patchelf

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cargo build --release

      - name: Package AppImage (Linux)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1 # run the AppImage tools without FUSE
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BIN=chem_3d_builder_rs
          APPDIR=AppDir

          mkdir -p "$APPDIR/usr/bin" \
                   "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp "target/release/$BIN" "$APPDIR/usr/bin/$BIN"
          cp packaging/linux/chem_3d_builder_rs.desktop \
             "$APPDIR/usr/share/applications/$BIN.desktop"
          rsvg-convert -w 256 -h 256 assets/icon.svg \
             -o "$APPDIR/usr/share/icons/hicolor/256x256/apps/$BIN.png"

          curl -fsSL -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o linuxdeploy-plugin-gtk.sh \
            https://github.com/linuxdeploy/linuxdeploy-plugin-gtk/releases/download/continuous/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy linuxdeploy-plugin-gtk.sh
          export PATH="$PWD:$PATH" # so linuxdeploy finds the gtk plugin

          export OUTPUT="chem_3d_builder-${VERSION}-x86_64.AppImage"
          ./linuxdeploy --appdir "$APPDIR" --plugin gtk \
            --desktop-file "$APPDIR/usr/share/applications/$BIN.desktop" \
            --icon-file "$APPDIR/usr/share/icons/hicolor/256x256/apps/$BIN.png" \
            --output appimage

          mkdir -p dist
          mv "$OUTPUT" dist/

      # -------------------------------------------------------------- Windows
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release

      - name: Package NSIS installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $env:PATH += ';C:\Program Files (x86)\NSIS'
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            $env:PATH += ';C:\Program Files (x86)\NSIS'
          }
          makensis -NOCD "/DVERSION=$version" "packaging\windows\installer.nsi"
          New-Item -ItemType Directory -Force dist | Out-Null
          Move-Item "chem_3d_builder-$version-setup.exe" dist\

      # ---------------------------------------------------------------- macOS
      - name: Build universal binary (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          lipo -create -output chem_3d_builder_rs \
            target/x86_64-apple-darwin/release/chem_3d_builder_rs \
            target/aarch64-apple-darwin/release/chem_3d_builder_rs

      - name: Package dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BIN=chem_3d_builder_rs
          APP="Chem 3D Builder.app"
          brew install librsvg

          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$BIN" "$APP/Contents/MacOS/$BIN"
          chmod +x "$APP/Contents/MacOS/$BIN"
          cp packaging/macos/Info.plist "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$APP/Contents/Info.plist"

          # SVG → .icns via an iconset of the required sizes.
          mkdir icon.iconset
          rsvg-convert -w 16   -h 16   assets/icon.svg -o icon.iconset/icon_16x16.png
          rsvg-convert -w 32   -h 32   assets/icon.svg -o icon.iconset/icon_16x16@2x.png
          rsvg-convert -w 32   -h 32   assets/icon.svg -o icon.iconset/icon_32x32.png
          rsvg-convert -w 64   -h 64   assets/icon.svg -o icon.iconset/icon_32x32@2x.png
          rsvg-convert -w 128  -h 128  assets/icon.svg -o icon.iconset/icon_128x128.png
          rsvg-convert -w 256  -h 256  assets/icon.svg -o icon.iconset/icon_128x128@2x.png
          rsvg-convert -w 256  -h 256  assets/icon.svg -o icon.iconset/icon_256x256.png
          rsvg-convert -w 512  -h 512  assets/icon.svg -o icon.iconset/icon_256x256@2x.png
          rsvg-convert -w 512  -h 512  assets/icon.svg -o icon.iconset/icon_512x512.png
          rsvg-convert -w 1024 -h 1024 assets/icon.svg -o icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/icon.icns"

          # Lay out a drag-to-Applications dmg.
          mkdir -p dmg_root
          cp -R "$APP" dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "Chem 3D Builder" -srcfolder dmg_root \
            -ov -format UDZO "chem_3d_builder-${VERSION}.dmg"

          mkdir -p dist
          mv "chem_3d_builder-${VERSION}.dmg" dist/

      # -------------------------------------------------------------- Publish
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
