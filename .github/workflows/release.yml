name: Release

# Pushing a `v*` tag builds native installers for Windows / macOS / Linux and
# publishes them as a GitHub Release. `workflow_dispatch` builds the same
# artifacts without releasing, which is handy for testing changes to this file.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------- Linux --
  linux:
    name: Linux (AppImage)
    runs-on: ubuntu-22.04 # oldest supported → widest glibc compatibility
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev librsvg2-bin librsvg2-common \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libssl-dev \
            desktop-file-utils patchelf

      - name: Build
        run: cargo build --release

      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1 # run the AppImage tools without FUSE
        run: |
          set -euo pipefail
          # Tags are the real source of truth; workflow_dispatch has no tag, so
          # fall back to a dev version rather than the branch name.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          BIN=chem_3d_builder_rs
          APPDIR=AppDir

          mkdir -p "$APPDIR/usr/bin" \
                   "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp "target/release/$BIN" "$APPDIR/usr/bin/$BIN"
          cp packaging/linux/chem_3d_builder_rs.desktop \
             "$APPDIR/usr/share/applications/$BIN.desktop"

          # OpenBabel runtime, beside the binary. The app resolves BABEL_LIBDIR
          # to its own directory and BABEL_DATADIR to <exe_dir>/data, so both
          # have to land in usr/bin. linuxdeploy cannot do this for us: it
          # follows NEEDED entries, and the .so plugins are dlopen'd, so it
          # never sees them. libopenbabel.so *is* NEEDED, so it gets bundled.
          #
          # Ask cargo which build directory it linked rather than globbing
          # target/release/build — a restored cache can hold several. This
          # re-run is a no-op that only re-emits the metadata.
          OB_OUT=$(cargo build --release --message-format=json \
            | jq -r 'select(.reason=="build-script-executed" and (.package_id|contains("openbabel-sys"))) | .out_dir' \
            | head -1)
          test -n "$OB_OUT" || { echo "openbabel-sys build directory not found" >&2; exit 1; }

          # Unix plugins are versioned MODULE libraries, e.g.
          # lib/openbabel/3.2.1/*.so (the .obf name is Windows-only).
          cp "$(dirname "$(find "$OB_OUT/lib/openbabel" -name '*.so' | head -1)")"/*.so \
             "$APPDIR/usr/bin/"
          cp -r "$(find "$OB_OUT/share/openbabel" -mindepth 1 -maxdepth 1 -type d | head -1)" \
                "$APPDIR/usr/bin/data"

          # Without these the AppImage still starts, and then has no force fields
          # and no 3D generation. Fail the release instead.
          test -f "$APPDIR/usr/bin/data/UFF.prm" || { echo "force-field data missing from AppDir" >&2; exit 1; }
          ls "$APPDIR"/usr/bin/*.so >/dev/null || { echo "no .so plugins in AppDir" >&2; exit 1; }

          rsvg-convert -w 256 -h 256 assets/icon.svg \
             -o "$APPDIR/usr/share/icons/hicolor/256x256/apps/$BIN.png"

          curl -fsSL -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o linuxdeploy-plugin-gtk.sh \
            https://github.com/linuxdeploy/linuxdeploy-plugin-gtk/releases/download/continuous/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy linuxdeploy-plugin-gtk.sh
          export PATH="$PWD:$PATH" # so linuxdeploy finds the gtk plugin

          export OUTPUT="chem_3d_builder-${VERSION}-x86_64.AppImage"
          ./linuxdeploy --appdir "$APPDIR" --plugin gtk \
            --desktop-file "$APPDIR/usr/share/applications/$BIN.desktop" \
            --icon-file "$APPDIR/usr/share/icons/hicolor/256x256/apps/$BIN.png" \
            --output appimage

          mkdir -p dist
          mv "$OUTPUT" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  # -------------------------------------------------------------- Windows --
  windows:
    name: Windows (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Stage OpenBabel runtime
        shell: pwsh
        run: |
          # openbabel-sys's build script already drops openbabel-3.dll,
          # inchi.dll and the .obf plugins into target\release. The data
          # directory is the piece it only bakes an absolute path to, so it has
          # to be copied next to the exe: that is what makes the app resolve its
          # force-field data here rather than at a path that exists only on this
          # runner.
          #
          # Ask cargo where that build ran instead of globbing target\release\build:
          # a restored cache can hold several openbabel-sys-<hash> directories and
          # only cargo knows which one it just linked. This re-run is a no-op that
          # only re-emits the metadata.
          $outDir = cargo build --release --message-format=json |
            ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object { $_.reason -eq 'build-script-executed' -and $_.package_id -like '*openbabel-sys*' } |
            Select-Object -First 1 -ExpandProperty out_dir
          if (-not $outDir) { throw "could not find openbabel-sys's build output directory" }
          Copy-Item -Recurse -Force "$outDir\bin\data" target\release\data

          # Missing any of this still produces an app that launches, and then has
          # no force fields and no 3D generation. Fail the release instead.
          foreach ($f in 'openbabel-3.dll', 'inchi.dll', 'data\UFF.prm', 'data\mmff94.ff') {
            if (-not (Test-Path "target\release\$f")) { throw "missing from bundle: $f" }
          }
          if (@(Get-ChildItem target\release\*.obf).Count -eq 0) {
            throw "no .obf plugins in target\release"
          }

      - name: Package NSIS installer
        shell: pwsh
        run: |
          # Tags are the real source of truth; workflow_dispatch has no tag, so
          # fall back to a dev version rather than the branch name.
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $version = '0.0.0-dev'
          }
          $env:PATH += ';C:\Program Files (x86)\NSIS'
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            $env:PATH += ';C:\Program Files (x86)\NSIS'
          }
          makensis -NOCD "/DVERSION=$version" "packaging\windows\installer.nsi"
          New-Item -ItemType Directory -Force dist | Out-Null
          Move-Item "chem_3d_builder-$version-setup.exe" dist\

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------- macOS --
  macos:
    name: macOS (dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Disable Cairo (breaks the x86_64 cross-build)
        # OpenBabel auto-detects Cairo and compiles its png2format plugin
        # against it. macos-latest is arm64 and Homebrew's Cairo is arm64-only,
        # so the x86_64 half of the universal build fails to link (undefined
        # _cairo_* symbols). This app ships no PNG depiction, so make Cairo
        # undiscoverable before building — with it gone, OpenBabel simply skips
        # png2format, keeping the x86_64 and arm64 plugin sets identical for the
        # lipo step below. librsvg (installed later for packaging) pulls Cairo
        # back in, which is fine: that is a separate, post-build step.
        run: brew uninstall --ignore-dependencies --formula cairo || true

      - name: Build universal binary
        run: |
          set -euo pipefail
          BIN=chem_3d_builder_rs
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          # Each target builds its own copy of OpenBabel from source, so this is
          # two full C++ builds and by far the slowest step in the workflow.
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin

          # Ask cargo where each build script ran rather than globbing: a
          # restored cache can hold several openbabel-sys-<hash> directories.
          ob_out() {
            cargo build --release --target "$1" --message-format=json \
              | jq -r 'select(.reason=="build-script-executed" and (.package_id|contains("openbabel-sys"))) | .out_dir' \
              | head -1
          }
          X_OUT=$(ob_out x86_64-apple-darwin)
          A_OUT=$(ob_out aarch64-apple-darwin)
          test -n "$X_OUT" && test -n "$A_OUT" || { echo "openbabel-sys build directories not found" >&2; exit 1; }

          # A universal app needs every Mach-O fat, not just the Rust binary:
          # libopenbabel is linked and each .so plugin is dlopen'd, so an app
          # carrying only x86_64 copies of those would fail on Apple silicon.
          mkdir -p universal
          lipo -create -output "universal/$BIN" \
            "target/x86_64-apple-darwin/release/$BIN" \
            "target/aarch64-apple-darwin/release/$BIN"

          X_LIB=$(ls "$X_OUT"/lib/libopenbabel.*.dylib | head -1)
          DYLIB=$(basename "$X_LIB")
          lipo -create -output "universal/$DYLIB" "$X_LIB" "$A_OUT/lib/$DYLIB"

          X_PLUGINS=$(dirname "$(find "$X_OUT/lib/openbabel" -name '*.so' | head -1)")
          A_PLUGINS=$(dirname "$(find "$A_OUT/lib/openbabel" -name '*.so' | head -1)")
          for plugin in "$X_PLUGINS"/*.so; do
            name=$(basename "$plugin")
            lipo -create -output "universal/$name" "$plugin" "$A_PLUGINS/$name"
          done

          # Data is plain text, identical across architectures.
          cp -R "$(find "$X_OUT/share/openbabel" -mindepth 1 -maxdepth 1 -type d | head -1)" universal/data
          test -f universal/data/UFF.prm || { echo "force-field data missing" >&2; exit 1; }
          echo "MACOS_DYLIB=$DYLIB" >> "$GITHUB_ENV"

      - name: Package dmg
        run: |
          set -euo pipefail
          # Tags are the real source of truth; workflow_dispatch has no tag, so
          # fall back to a dev version rather than the branch name.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          BIN=chem_3d_builder_rs
          APP="Chem 3D Builder.app"
          brew install librsvg

          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          # The whole OpenBabel runtime goes beside the binary: that is where the
          # app looks for BABEL_LIBDIR (the .so plugins) and <exe_dir>/data.
          cp -R universal/. "$APP/Contents/MacOS/"
          chmod +x "$APP/Contents/MacOS/$BIN"

          # The build baked an rpath pointing into this runner's target directory,
          # which no user has, so point the binary at its own directory instead.
          DYLIB="$MACOS_DYLIB"
          install_name_tool -id "@rpath/$DYLIB" "$APP/Contents/MacOS/$DYLIB"
          OLD_REF=$(otool -L "$APP/Contents/MacOS/$BIN" | awk '/libopenbabel/ {print $1; exit}')
          test -n "$OLD_REF" || { echo "binary does not reference libopenbabel" >&2; exit 1; }
          install_name_tool -change "$OLD_REF" "@rpath/$DYLIB" "$APP/Contents/MacOS/$BIN"
          install_name_tool -add_rpath "@executable_path" "$APP/Contents/MacOS/$BIN"
          for plugin in "$APP/Contents/MacOS"/*.so; do
            ref=$(otool -L "$plugin" | awk '/libopenbabel/ {print $1; exit}')
            [ -n "$ref" ] && install_name_tool -change "$ref" "@rpath/$DYLIB" "$plugin"
          done

          # install_name_tool invalidates code signatures, and arm64 refuses to
          # run an unsigned Mach-O — an ad-hoc signature is enough to load.
          codesign --force --sign - "$APP/Contents/MacOS/$DYLIB"
          for plugin in "$APP/Contents/MacOS"/*.so; do codesign --force --sign - "$plugin"; done
          codesign --force --sign - "$APP/Contents/MacOS/$BIN"

          cp packaging/macos/Info.plist "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$APP/Contents/Info.plist"

          # SVG → .icns via an iconset of the required sizes.
          mkdir icon.iconset
          rsvg-convert -w 16   -h 16   assets/icon.svg -o icon.iconset/icon_16x16.png
          rsvg-convert -w 32   -h 32   assets/icon.svg -o icon.iconset/icon_16x16@2x.png
          rsvg-convert -w 32   -h 32   assets/icon.svg -o icon.iconset/icon_32x32.png
          rsvg-convert -w 64   -h 64   assets/icon.svg -o icon.iconset/icon_32x32@2x.png
          rsvg-convert -w 128  -h 128  assets/icon.svg -o icon.iconset/icon_128x128.png
          rsvg-convert -w 256  -h 256  assets/icon.svg -o icon.iconset/icon_128x128@2x.png
          rsvg-convert -w 256  -h 256  assets/icon.svg -o icon.iconset/icon_256x256.png
          rsvg-convert -w 512  -h 512  assets/icon.svg -o icon.iconset/icon_256x256@2x.png
          rsvg-convert -w 512  -h 512  assets/icon.svg -o icon.iconset/icon_512x512.png
          rsvg-convert -w 1024 -h 1024 assets/icon.svg -o icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/icon.icns"

          # Lay out a drag-to-Applications dmg.
          mkdir -p dmg_root
          cp -R "$APP" dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "Chem 3D Builder" -srcfolder dmg_root \
            -ov -format UDZO "chem_3d_builder-${VERSION}.dmg"

          mkdir -p dist
          mv "chem_3d_builder-${VERSION}.dmg" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  # -------------------------------------------------------------- Release --
  release:
    name: Publish release
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    # Only tags produce a release; workflow_dispatch runs stop after building.
    if: github.ref_type == 'tag'
    permissions:
      contents: write # required to create the release and upload assets
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
